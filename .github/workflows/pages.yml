name: Publish Eclipse portal to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Sitio estático sin build: se publica tal cual (página, estilos, módulos y fuentes).
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css _site/
          cp -r src assets _site/
          touch _site/.nojekyll
          # Sello de versión por deploy: el navegador no puede reusar una copia vieja
          # (Pages permite guardar 10 min y Safari a veces más).
          v="${GITHUB_SHA::7}"
          sed -i "s#\./styles\.css#./styles.css?v=$v#; s#\./src/app\.js#./src/app.js?v=$v#" _site/index.html
          find _site/src -name '*.js' -exec sed -i -E "s#(from \"\.\.?/[^\"]+\.js)\"#\1?v=$v\"#g" {} +
          grep -q "app.js?v=$v" _site/index.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
